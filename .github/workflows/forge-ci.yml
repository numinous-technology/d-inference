name: Numinous Forge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [master]
  workflow_dispatch:
    inputs:
      head:
        description: Full 40-character commit SHA to verify
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  statuses: write
  id-token: write

concurrency:
  group: forge-${{ github.event.pull_request.number || inputs.head }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'numinous-technology/d-inference' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Obtain CI-only AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.FORGE_CI_ROLE }}
          aws-region: us-east-1
          role-duration-seconds: 3600
          allowed-account-ids: '339712930505'
      - name: Run trusted Forge client
        id: forge
        env:
          GH_TOKEN: ${{ github.token }}
          FORGE_FUNCTION: ${{ vars.FORGE_FUNCTION }}
          FORGE_REGION: us-east-1
          FORGE_BUCKET: ${{ vars.FORGE_BUCKET }}
          FORGE_CLI_KEY: ${{ vars.FORGE_CLI_KEY }}
          FORGE_CLI_SHA256: ${{ vars.FORGE_CLI_SHA256 }}
        shell: python
        run: |
          """Trusted GitHub runner. This file is embedded in the installed workflow."""

          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import urllib.request

          import time

          """Public GitHub progress summaries. Never publish raw task reasons or artifacts."""
          from datetime import datetime, timezone
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          REPOSITORY = "numinous-technology/d-inference"
          SHA = re.compile(r"[a-f0-9]{40}")
          TASK_ID = re.compile(r"[a-f0-9]{32}")
          TERMINAL = {"verified", "published", "blocked", "cancelled", "failed", "timed_out"}
          CHECKS = {"protocol": "Protocol", "coordinator": "Coordinator", "docs": "Documentation",
                    "reconnect": "Reconnect regression", "provider": "Provider"}
          STATES = {
              "queued": ("Queued", "Waiting to start."),
              "reproducing": ("Reproducing the issue", "Checking the reported failure before changing code."),
              "implementing": ("Agent working", "Preparing a proposed change. It has not passed verification yet."),
              "verifying": ("Verification in progress", "Running the accepted checks in a separate environment."),
              "verified": ("Verification passed", "The accepted checks passed. Ready for human review."),
              "published": ("Change published", "The independently verified candidate is available for review. PR CI is reported separately."),
              "blocked": ("Needs attention", "Verification could not complete successfully. Inspect the linked run before proceeding."),
              "failed": ("Failed", "The task did not complete successfully."),
              "timed_out": ("Timed out", "The task exceeded its deadline."),
              "cancelling": ("Stopping", "Cancellation is in progress."),
              "cancelled": ("Cancelled", "The task was cancelled."),
              "superseded": ("New commits need verification", "This result belongs to an older revision. Wait for the check on the latest commit."),
              "reconnecting": ("Reconnecting to task updates", "The task may still be running. Retrying the status connection."),
              "interrupted": ("Updates interrupted", "This reporter stopped before confirming a result. Check the workflow; the task may still be running."),
              "error": ("Could not complete verification", "Open the workflow for details. No passing result was recorded."),
          }


          def github(path, body=None, method=None):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + REPOSITORY + path,
                  data=None if body is None else json.dumps(body).encode(), method=method,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)


          def valid_task(task, head, task_id=None):
              return (isinstance(task, dict) and TASK_ID.fullmatch(task.get("id", "")) is not None
                      and task.get("lane") == "ci"
                      and (task_id is None or task["id"] == task_id)
                      and task.get("source") == {"repo": "https://github.com/" + REPOSITORY + ".git", "commit": head})


          def summary(task, state=None):
              state = state or task.get("state", "queued")
              if state not in STATES:
                  raise ValueError("unknown task state")
              title, detail = STATES[state]
              reason = task.get("reason", "")
              if state == "verified" and task.get("lane") != "ci":
                  detail = "The proposed change passed its accepted checks. PR verification is reported separately."
              if state == "blocked":
                  match = re.fullmatch(r"verification failed: ([a-zA-Z0-9_-]+) \([a-f0-9]{32}\)", reason)
                  if match and match[1] in CHECKS:
                      title, detail = "Checks failed", f"{CHECKS[match[1]]} did not pass. Open the run to inspect the failure."
                  elif reason == "agent produced no candidate patch":
                      title, detail = "No code change proposed", "The task ended without a patch. Review the request before asking for a revision."
                  elif reason.startswith(("unsupported capability ", "no accepted CI coverage for ")):
                      title, detail = "Coverage needed", "The changed files need checks that are not configured. This PR has not passed verification."
                  elif reason.startswith("CI revision no longer current:"):
                      title, detail = STATES["superseded"]
              lines = [f"**{title}**", "", detail]
              if task.get("lane") == "ci":
                  lines += ["", "This run checks the PR; it does not modify code."]
              attempts = task.get("attempts") or []
              round_number = task.get("verification_round", 0)
              checks = []
              for attempt in attempts:
                  if attempt.get("stage") == "verify" and attempt.get("number") == round_number:
                      name = CHECKS.get(attempt.get("check"))
                      if name and name not in checks:
                          checks.append(name)
              if checks:
                  label = "Checks passed" if state in {"verified", "published"} else "Checks reached"
                  lines += ["", f"{label}: " + ", ".join(checks) + "."]
              if state == "implementing" and task.get("agent_attempts", 0) >= 1:
                  lines += ["", "The agent is revising its earlier candidate."]
              return "\n".join(lines)


          class ProgressComment:
              def __init__(self, pr, head, run_url, *, slot="ci", author="github-actions[bot]", api=github):
                  if type(pr) is not int or pr < 1 or not SHA.fullmatch(head):
                      raise ValueError("invalid PR or source SHA")
                  if slot != "ci" and not TASK_ID.fullmatch(slot):
                      raise ValueError("invalid comment slot")
                  if not re.fullmatch(r"https://github.com/numinous-technology/d-inference/(actions/runs/[0-9]+|pull/[0-9]+)", run_url):
                      raise ValueError("invalid progress link")
                  self.pr, self.head, self.url = pr, head, run_url
                  self.slot, self.author, self.api = slot, author, api
                  self.marker = f"<!-- numinous-forge:{slot} -->"
                  self.last_body = None

              def find(self):
                  for page in range(1, 101):
                      comments = self.api(f"/issues/{self.pr}/comments?per_page=100&page={page}")
                      for comment in comments:
                          if comment.get("user", {}).get("login") == self.author and comment.get("body", "").startswith(self.marker + "\n"):
                              return comment
                      if len(comments) < 100:
                          return None
                  raise ValueError("comment history exceeds supported pagination")

              def write(self, task, state=None, *, owned_only=False):
                  current = self.api(f"/pulls/{self.pr}")
                  same_head = current["head"]["sha"] == self.head
                  if not same_head:
                      state = "superseded"
                  existing = self.find()
                  ownership = f"<!-- run:{self.url} head:{self.head} -->"
                  if existing and ownership not in existing["body"] and (owned_only or not same_head):
                      return False
                  if owned_only and not existing:
                      return False
                  # A stale event must never create a new comment after a newer commit arrives.
                  if not existing and not same_head:
                      return False
                  revision = task.get("revision", 0)
                  if type(revision) is not int or revision < 0:
                      raise ValueError("invalid task revision")
                  if self.slot != "ci" and existing:
                      previous = re.search(r"<!-- task-revision:([0-9]+) -->", existing["body"])
                      if previous and int(previous[1]) > revision:
                          return False
                  label = "PR verification" if self.slot == "ci" else "Engineering task"
                  effective_state = state or task.get("state", "queued")
                  content = f"{self.marker}\n{ownership}\n<!-- state:{effective_state} -->\n<!-- task-revision:{revision} -->\n### Numinous Forge · {label}\n\n" + summary(task, state)
                  revision_label = "Revision" if self.slot == "ci" else "Source revision"
                  content += f"\n\n{revision_label}: [`{self.head[:12]}`](https://github.com/{REPOSITORY}/commit/{self.head})."
                  source = task.get("verification_source", {}).get("commit", "")
                  if SHA.fullmatch(source):
                      content += f" Tested merge: `{source[:12]}`."
                  link_label = "Open workflow and results" if "/actions/runs/" in self.url else "Open pull request"
                  content += f"\n\n[{link_label}]({self.url})"
                  task_id = task.get("id", "")
                  if TASK_ID.fullmatch(task_id):
                      content += f" · Task `{task_id}`"
                  # Deduplicate state polls; timestamps advance only when the public state changes.
                  if content == self.last_body:
                      return same_head
                  stamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
                  body = content + f"\n\n_Last observed {stamp}. This comment updates as work progresses._"
                  if existing:
                      self.api(f"/issues/comments/{existing['id']}", {"body": body}, method="PATCH")
                  else:
                      self.api(f"/issues/{self.pr}/comments", {"body": body})
                  self.last_body = content
                  return same_head



          def target(event, event_name):
              if event_name == "pull_request_target":
                  if event["pull_request"]["base"]["repo"]["full_name"] != REPOSITORY:
                      raise ValueError("unexpected PR repository")
                  head = event["pull_request"]["head"]["sha"]
                  pr = event["number"]
                  if type(pr) is not int or pr < 1:
                      raise ValueError("invalid PR number")
              elif event_name == "workflow_dispatch":
                  head, pr = event["inputs"]["head"], 0
              else:
                  raise ValueError("unsupported event")
              if not isinstance(head, str) or not re.fullmatch(r"[a-f0-9]{40}", head):
                  raise ValueError("head must be a full commit SHA")
              return head, pr


          def verified(task, head):
              return (task.get("state") == "verified"
                      and task.get("source") == {"repo": "https://github.com/" + REPOSITORY + ".git", "commit": head}
                      and bool(task.get("verification_run_ids"))
                      and bool(task.get("policy_digest")))


          def main():
              if os.environ["GITHUB_REPOSITORY"] != REPOSITORY or os.environ["GITHUB_REF"] != "refs/heads/master":
                  raise ValueError("workflow must run from the trusted fork default branch")
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              head, pr = target(event, os.environ["GITHUB_EVENT_NAME"])
              if pr and github(f"/pulls/{pr}")["head"]["sha"] != head:
                  print("PR changed before submission; the newer event will verify its own head.")
                  return 0
              # Resolve the commit in the authorized repository before creating any status.
              if github("/commits/" + head)["sha"] != head:
                  raise ValueError("commit does not belong to the authorized fork")
              key = os.environ["FORGE_CLI_KEY"]
              expected = os.environ["FORGE_CLI_SHA256"]
              if not re.fullmatch(r"releases/forge/[a-f0-9]{64}/forge", key) or not re.fullmatch(r"[a-f0-9]{64}", expected):
                  raise ValueError("CLI key and SHA must identify an immutable release")
              if key.split("/")[2] != expected:
                  raise ValueError("CLI key and expected hash differ")
              executable = Path(os.environ["RUNNER_TEMP"]) / "numinous-forge"
              subprocess.run(["aws", "s3", "cp", "s3://" + os.environ["FORGE_BUCKET"] + "/" + key, str(executable), "--only-show-errors"], check=True)
              if hashlib.sha256(executable.read_bytes()).hexdigest() != expected:
                  raise ValueError("CLI checksum mismatch")
              executable.chmod(0o700)
              print(f"CLI: {executable.name}; SHA-256: {expected}", flush=True)
              url = f"https://github.com/{REPOSITORY}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              status_context = "Numinous Forge / verification" if pr else "Numinous Forge / baseline"

              def status(state, description):
                  github("/statuses/" + head, {"state": state, "context": status_context, "description": description, "target_url": url})

              reporter = ProgressComment(pr, head, url, api=github) if pr else None
              task = {"lane": "ci", "state": "queued"}
              status("pending", "Verification queued in Numinous Forge")
              try:
                  if reporter:
                      reporter.write(task)
                  args = [str(executable), "ci", "--repo", REPOSITORY, "--head", head, "--key", "github:" + os.environ["GITHUB_RUN_ID"] + ":" + os.environ.get("GITHUB_RUN_ATTEMPT", "1")]
                  if pr:
                      args += ["--pr", str(pr)]
                  deadline = time.monotonic() + 2700
                  result = subprocess.run(args, stdout=subprocess.PIPE, text=True, stderr=subprocess.PIPE, timeout=180, check=True)
                  task = json.loads(result.stdout)
                  if not valid_task(task, head):
                      raise ValueError("task identity differs from requested CI source")
                  task_id = task["id"]
                  while True:
                      Path("forge-task.json").write_text(json.dumps(task))
                      if task.get("state") == "verified" and not verified(task, head):
                          raise ValueError("verified task lacks required evidence")
                      if reporter and not reporter.write(task):
                          status("error", "Superseded by a newer PR head; verify the latest commit")
                          return 1
                      if task.get("state") in TERMINAL:
                          break
                      if task.get("state") not in {"queued", "verifying", "cancelling"}:
                          raise ValueError("unexpected CI state")
                      if time.monotonic() >= deadline:
                          raise TimeoutError("CI progress deadline exceeded")
                      time.sleep(15)
                      for retry in range(3):
                          try:
                              result = subprocess.run([str(executable), "task", "get", task_id], stdout=subprocess.PIPE, text=True, stderr=subprocess.PIPE, timeout=120, check=True)
                              break
                          except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                              if retry == 2:
                                  raise
                              if reporter:
                                  reporter.write(task, "reconnecting")
                              time.sleep(5)
                      task = json.loads(result.stdout)
                      if not valid_task(task, head, task_id):
                          raise ValueError("task identity changed during polling")
                  passed = verified(task, head)
                  if pr and github(f"/pulls/{pr}")["head"]["sha"] != head:
                      if reporter:
                          reporter.write(task, "superseded")
                      status("error", "Superseded by a newer PR head; this result is for the old commit")
                      return 1
                  status("success" if passed else "failure", "Required checks passed" if passed else "Verification did not pass; see the Forge comment")
                  print(json.dumps({key: task[key] for key in ("id", "state", "source", "verification_run_ids", "policy_digest") if key in task}))
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                      output.write(f"### Numinous Forge verification\n\nCommit: `{head}`\n\nResult: {'passed' if passed else 'failed'}\n\n")
                      output.write(f"Task: `{task_id}`. Verification runs and policy identity are in the workflow log.\n")
                  return 0 if passed else 1
              except Exception:
                  status("error", "Forge could not complete verification; inspect the workflow log")
                  if reporter:
                      reporter.write(task, "error", owned_only=True)
                  raise


          if __name__ == "__main__":
              sys.exit(main())
      - name: Finalize interrupted progress
        if: ${{ always() && steps.forge.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          """Close an interrupted progress report when the Actions job can still finalize."""
          import json
          import os
          from pathlib import Path
          import re
          import sys

          """Public GitHub progress summaries. Never publish raw task reasons or artifacts."""
          from datetime import datetime, timezone
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          REPOSITORY = "numinous-technology/d-inference"
          SHA = re.compile(r"[a-f0-9]{40}")
          TASK_ID = re.compile(r"[a-f0-9]{32}")
          TERMINAL = {"verified", "published", "blocked", "cancelled", "failed", "timed_out"}
          CHECKS = {"protocol": "Protocol", "coordinator": "Coordinator", "docs": "Documentation",
                    "reconnect": "Reconnect regression", "provider": "Provider"}
          STATES = {
              "queued": ("Queued", "Waiting to start."),
              "reproducing": ("Reproducing the issue", "Checking the reported failure before changing code."),
              "implementing": ("Agent working", "Preparing a proposed change. It has not passed verification yet."),
              "verifying": ("Verification in progress", "Running the accepted checks in a separate environment."),
              "verified": ("Verification passed", "The accepted checks passed. Ready for human review."),
              "published": ("Change published", "The independently verified candidate is available for review. PR CI is reported separately."),
              "blocked": ("Needs attention", "Verification could not complete successfully. Inspect the linked run before proceeding."),
              "failed": ("Failed", "The task did not complete successfully."),
              "timed_out": ("Timed out", "The task exceeded its deadline."),
              "cancelling": ("Stopping", "Cancellation is in progress."),
              "cancelled": ("Cancelled", "The task was cancelled."),
              "superseded": ("New commits need verification", "This result belongs to an older revision. Wait for the check on the latest commit."),
              "reconnecting": ("Reconnecting to task updates", "The task may still be running. Retrying the status connection."),
              "interrupted": ("Updates interrupted", "This reporter stopped before confirming a result. Check the workflow; the task may still be running."),
              "error": ("Could not complete verification", "Open the workflow for details. No passing result was recorded."),
          }


          def github(path, body=None, method=None):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + REPOSITORY + path,
                  data=None if body is None else json.dumps(body).encode(), method=method,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)


          def valid_task(task, head, task_id=None):
              return (isinstance(task, dict) and TASK_ID.fullmatch(task.get("id", "")) is not None
                      and task.get("lane") == "ci"
                      and (task_id is None or task["id"] == task_id)
                      and task.get("source") == {"repo": "https://github.com/" + REPOSITORY + ".git", "commit": head})


          def summary(task, state=None):
              state = state or task.get("state", "queued")
              if state not in STATES:
                  raise ValueError("unknown task state")
              title, detail = STATES[state]
              reason = task.get("reason", "")
              if state == "verified" and task.get("lane") != "ci":
                  detail = "The proposed change passed its accepted checks. PR verification is reported separately."
              if state == "blocked":
                  match = re.fullmatch(r"verification failed: ([a-zA-Z0-9_-]+) \([a-f0-9]{32}\)", reason)
                  if match and match[1] in CHECKS:
                      title, detail = "Checks failed", f"{CHECKS[match[1]]} did not pass. Open the run to inspect the failure."
                  elif reason == "agent produced no candidate patch":
                      title, detail = "No code change proposed", "The task ended without a patch. Review the request before asking for a revision."
                  elif reason.startswith(("unsupported capability ", "no accepted CI coverage for ")):
                      title, detail = "Coverage needed", "The changed files need checks that are not configured. This PR has not passed verification."
                  elif reason.startswith("CI revision no longer current:"):
                      title, detail = STATES["superseded"]
              lines = [f"**{title}**", "", detail]
              if task.get("lane") == "ci":
                  lines += ["", "This run checks the PR; it does not modify code."]
              attempts = task.get("attempts") or []
              round_number = task.get("verification_round", 0)
              checks = []
              for attempt in attempts:
                  if attempt.get("stage") == "verify" and attempt.get("number") == round_number:
                      name = CHECKS.get(attempt.get("check"))
                      if name and name not in checks:
                          checks.append(name)
              if checks:
                  label = "Checks passed" if state in {"verified", "published"} else "Checks reached"
                  lines += ["", f"{label}: " + ", ".join(checks) + "."]
              if state == "implementing" and task.get("agent_attempts", 0) >= 1:
                  lines += ["", "The agent is revising its earlier candidate."]
              return "\n".join(lines)


          class ProgressComment:
              def __init__(self, pr, head, run_url, *, slot="ci", author="github-actions[bot]", api=github):
                  if type(pr) is not int or pr < 1 or not SHA.fullmatch(head):
                      raise ValueError("invalid PR or source SHA")
                  if slot != "ci" and not TASK_ID.fullmatch(slot):
                      raise ValueError("invalid comment slot")
                  if not re.fullmatch(r"https://github.com/numinous-technology/d-inference/(actions/runs/[0-9]+|pull/[0-9]+)", run_url):
                      raise ValueError("invalid progress link")
                  self.pr, self.head, self.url = pr, head, run_url
                  self.slot, self.author, self.api = slot, author, api
                  self.marker = f"<!-- numinous-forge:{slot} -->"
                  self.last_body = None

              def find(self):
                  for page in range(1, 101):
                      comments = self.api(f"/issues/{self.pr}/comments?per_page=100&page={page}")
                      for comment in comments:
                          if comment.get("user", {}).get("login") == self.author and comment.get("body", "").startswith(self.marker + "\n"):
                              return comment
                      if len(comments) < 100:
                          return None
                  raise ValueError("comment history exceeds supported pagination")

              def write(self, task, state=None, *, owned_only=False):
                  current = self.api(f"/pulls/{self.pr}")
                  same_head = current["head"]["sha"] == self.head
                  if not same_head:
                      state = "superseded"
                  existing = self.find()
                  ownership = f"<!-- run:{self.url} head:{self.head} -->"
                  if existing and ownership not in existing["body"] and (owned_only or not same_head):
                      return False
                  if owned_only and not existing:
                      return False
                  # A stale event must never create a new comment after a newer commit arrives.
                  if not existing and not same_head:
                      return False
                  revision = task.get("revision", 0)
                  if type(revision) is not int or revision < 0:
                      raise ValueError("invalid task revision")
                  if self.slot != "ci" and existing:
                      previous = re.search(r"<!-- task-revision:([0-9]+) -->", existing["body"])
                      if previous and int(previous[1]) > revision:
                          return False
                  label = "PR verification" if self.slot == "ci" else "Engineering task"
                  effective_state = state or task.get("state", "queued")
                  content = f"{self.marker}\n{ownership}\n<!-- state:{effective_state} -->\n<!-- task-revision:{revision} -->\n### Numinous Forge · {label}\n\n" + summary(task, state)
                  revision_label = "Revision" if self.slot == "ci" else "Source revision"
                  content += f"\n\n{revision_label}: [`{self.head[:12]}`](https://github.com/{REPOSITORY}/commit/{self.head})."
                  source = task.get("verification_source", {}).get("commit", "")
                  if SHA.fullmatch(source):
                      content += f" Tested merge: `{source[:12]}`."
                  link_label = "Open workflow and results" if "/actions/runs/" in self.url else "Open pull request"
                  content += f"\n\n[{link_label}]({self.url})"
                  task_id = task.get("id", "")
                  if TASK_ID.fullmatch(task_id):
                      content += f" · Task `{task_id}`"
                  # Deduplicate state polls; timestamps advance only when the public state changes.
                  if content == self.last_body:
                      return same_head
                  stamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
                  body = content + f"\n\n_Last observed {stamp}. This comment updates as work progresses._"
                  if existing:
                      self.api(f"/issues/comments/{existing['id']}", {"body": body}, method="PATCH")
                  else:
                      self.api(f"/issues/{self.pr}/comments", {"body": body})
                  self.last_body = content
                  return same_head



          def main():
              if os.environ["GITHUB_REPOSITORY"] != REPOSITORY or os.environ["GITHUB_REF"] != "refs/heads/master":
                  raise ValueError("untrusted workflow context")
              if os.environ["GITHUB_EVENT_NAME"] != "pull_request_target":
                  return
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              head, pr = event["pull_request"]["head"]["sha"], event["number"]
              url = f"https://github.com/{REPOSITORY}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              reporter = ProgressComment(pr, head, url, api=github)
              existing = reporter.find()
              if existing and f"<!-- run:{url} head:{head} -->" not in existing["body"]:
                  return
              if existing and re.search(r"<!-- state:(verified|blocked|cancelled|failed|timed_out|superseded|error) -->", existing["body"]):
                  return
              reporter.write({"lane": "ci"}, "interrupted")
              github("/statuses/" + head, {"state": "error", "context": "Numinous Forge / verification",
                                         "description": "Verification reporting was interrupted; inspect the workflow", "target_url": url})


          if __name__ == "__main__":
              main()
